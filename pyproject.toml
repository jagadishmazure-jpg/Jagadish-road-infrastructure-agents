[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "road-agents"
version = "0.1.0"
description = "Agentic planning over a synthetic road network: maintenance ranking, closure simulation, human-gated recommendations."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
